<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ski 3D Prototype</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0f14; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 10;
        color: #ffffff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14px;
        line-height: 1.3;
        background: rgba(0,0,0,0.35);
        padding: 8px 10px;
        border-radius: 8px;
        user-select: none;
      }
      #hint {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        color: rgba(255,255,255,0.85);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        line-height: 1.3;
        background: rgba(0,0,0,0.25);
        padding: 8px 10px;
        border-radius: 8px;
        max-width: 520px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">Loading…</div>
    <div id="hint">
      控制：←/→ 或 A/D 转向；鼠标水平移动也可转向。<br/>
      玩法：捡金币/雪兔/魔力雪杖；2km-7km 随机雪暴；稀有龙卷风盘旋（碰到回退 1km）。<br/>
      这是 2D 角色 + 3D 场景的原型入口（/three.html）。
    </div>
    <script type="module" src="/src/three3d/main3d.js"></script>
  </body>
</html>
